<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>inline block</title>

	<style>

		body {
			font-family: sans-serif;
			font-size: 20px;
			line-height: 150%;
			margin: 5rem;
		}

		div {
			border: 2px solid blue;
			padding: 1rem;
		}

		span {
			border-bottom: 2px dotted magenta;
			font-weight: bold;
		}

	</style>

</head>
<body>
	
	<div>
		Lorem ipsum dolor sit amet, 
		<span>
			consectetur adipisicing elit. 
			Ipsum, quasi, maxime delectus sint fugiat labore 
			laboriosam quisquam eligendi officia repellendus 
		</span>
		beatae ducimus dicta laudantium atque 
		excepturi odit optio nemo nobis!
	</div>

</body>
</html>
