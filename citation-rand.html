        h1 { position: relative;}
        h1:before{
            content: "b";

<body>
    <h1>A logo doesn’t sell, it identifies. A logo derives its meaning from the quality of the thing it symbolizes, not the other way around. A logo is less important than the product it signifies; what it means is more important than what it looks like.</h1>
    <p>— Paul Rand</p>
